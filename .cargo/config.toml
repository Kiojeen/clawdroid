# Applies to the Rust library under app/src/main/rust.
# The RustJNI plugin owns linker paths in that crate's .cargo/config.toml,
# so page-size flags live here to avoid duplicate target tables.

[target.'cfg(all(target_os = "android", target_arch = "aarch64"))']
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.'cfg(all(target_os = "android", target_arch = "x86_64"))']
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
