[template]
cargo_generate_version = ">=0.19.0"
ignore = [
    ".gradle",
    ".idea",
    "build",
    "app/build",
    "app/src/main/rust/target",
    "local.properties",
    ".cursor",
]
exclude = [
    "gradle/wrapper/gradle-wrapper.jar",
    "**/*.webp",
    "**/*.png",
    "**/*.so",
]

[hooks]
init = ["init.rhai"]
pre = ["pre.rhai"]
post = ["post.rhai"]
