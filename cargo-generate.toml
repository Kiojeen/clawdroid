[template]
cargo_generate_version = ">=0.19.0"
fmt = false
vcs = "None"
ignore = [
    ".gradle",
    ".idea",
    "build",
    "app/build",
    "app/src/main/rust/target",
    "local.properties",
    ".cursor",
]
exclude = [
    "gradle/wrapper/gradle-wrapper.jar",
    "**/*.webp",
    "**/*.png",
    "**/*.so",
]

[hooks]
init = ["init.rhai"]
pre = ["pre.rhai"]
post = ["post.rhai"]

[placeholders.language]
type = "string"
prompt = "Language"
choices = ["java", "kotlin"]
default = "java"

[placeholders.app_name]
type = "string"
prompt = "App name"
default = "ClawDroid"

[placeholders.package_name]
type = "string"
prompt = "Package name"
default = "com.example.clawdroid"
regex = "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"

[placeholders.lib_name]
type = "string"
prompt = "Library name"
default = "clawdroid"
regex = "^[a-z][a-z0-9_]*$"

[placeholders.abis]
type = "array"
prompt = "ABIs"
choices = ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]
default = ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]

[placeholders.min_sdk]
type = "string"
prompt = "minSdk"
choices = ["24", "26", "28", "33", "34"]
default = "24"

[placeholders.git_repo]
type = "bool"
prompt = "Git repo"
default = true

[conditional.'language == "java"']
ignore = [
    "app/src/main/kotlin",
    "app/src/test/kotlin",
    "app/src/androidTest/kotlin",
]

[conditional.'language == "kotlin"']
ignore = [
    "app/src/main/java",
    "app/src/test/java",
    "app/src/androidTest/java",
]
